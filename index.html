<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie Journal</title>

  <link rel="icon" href="https://fav.farm/🎬">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase & SortableJS -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  
  <!-- Thư viện Chụp ảnh & Xuất PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #f7f4ef;
      --card-bg: #ffffff;
      --text-main: #2c2a29;
      --text-muted: #615e5a;
      --border-color: #e5dfd5;
      --accent-star: #d4a359;
      --star-empty: #d6ccbc;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.06);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-hand: 'Lora', serif;

      --tq-bg: #ffe6e6; --tq-border: #f19999;
      --hq-bg: #e0f0ff; --hq-border: #8bbdf5;
      --am-bg: #f2e2fe; --am-border: #cc9bf4;
      --nb-bg: #ffe2ee; --nb-border: #f79cc0;
      --vn-bg: #fff9cf; --vn-border: #f1d460;
      --tl-bg: #dcf5d7; --tl-border: #8edc82;
      --khac-bg: #ebeae6; --khac-border: #beb8ad;
      --modal-bg: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-main: #e6e6e6;
      --text-muted: #a0a0a0;
      --border-color: #33333d;
      --star-empty: #444450;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.4);

      --tq-bg: #2d1818; --tq-border: #662b2b;
      --hq-bg: #142433; --hq-border: #284b70;
      --am-bg: #24182d; --am-border: #522b66;
      --nb-bg: #2d1822; --nb-border: #662b45;
      --vn-bg: #2d2a18; --vn-border: #665c2b;
      --tl-bg: #182d1a; --tl-border: #2b6630;
      --khac-bg: #1f1f22; --khac-border: #44444a;
      --modal-bg: #1e1e24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 40px 20px;
      background-image: radial-gradient(var(--border-color) 0.8px, transparent 0.8px);
      background-size: 16px 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container { max-width: 1280px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 25px; }

    .title {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: var(--font-hand);
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .stats-badge {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-sm);
    }

    .btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-auth { background: #d4a359; color: #fff; }
    .btn-darkmode { background: #4a4a5a; color: #fff; }
    .btn-export { background: #2e7d32; color: #fff; }

    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      box-shadow: var(--shadow-sm);
    }

    .sort-select {
      padding: 10px 16px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--bg-color);
      border-color: var(--text-main);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

    .card {
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .card[data-country="TQ"] { background-color: var(--tq-bg); border-color: var(--tq-border); }
    .card[data-country="HQ"] { background-color: var(--hq-bg); border-color: var(--hq-border); }
    .card[data-country="AM"] { background-color: var(--am-bg); border-color: var(--am-border); }
    .card[data-country="NB"] { background-color: var(--nb-bg); border-color: var(--nb-border); }
    .card[data-country="VN"] { background-color: var(--vn-bg); border-color: var(--vn-border); }
    .card[data-country="TL"] { background-color: var(--tl-bg); border-color: var(--tl-border); }
    .card[data-country="Khac"] { background-color: var(--khac-bg); border-color: var(--khac-border); }

    .card.is-admin { cursor: grab; }
    .card.is-admin:active { cursor: grabbing; }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: transform 0.1s;
    }
    .icon-btn:hover { transform: scale(1.1); }

    .poster-frame {
      width: 100%;
      aspect-ratio: 2 / 3;
      border: 1px dashed rgba(0,0,0,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      text-align: center;
      padding: 8px;
      cursor: pointer;
    }

    .poster-frame img { width: 100%; height: 100%; object-fit: cover; }
    .file-input { display: none; }

    .editable-text { outline: none; padding: 2px 4px; border-radius: 3px; }
    .editable-text.can-edit:focus { background: rgba(255,255,255,0.4); }

    .movie-title { font-family: var(--font-hand); font-size: 1.1rem; font-weight: 600; }
    .movie-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 4px; flex-wrap: wrap; }

    .rating-container {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
    }

    .stars-wrapper { display: flex; justify-content: space-between; }
    .star-box { position: relative; font-size: 1rem; width: 10%; text-align: center; }
    .star-box.can-edit { cursor: pointer; }
    .star-base { color: var(--star-empty); }
    .star-fill { position: absolute; top: 0; left: 0; color: var(--accent-star); overflow: hidden; width: 0%; pointer-events: none; }
    .click-zone { position: absolute; top: 0; height: 100%; width: 50%; z-index: 2; }
    .click-zone.left { left: 0; }
    .click-zone.right { right: 0; }

    .tags-container {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .tag-select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px;
      background: rgba(255,255,255,0.3);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }

    .tag-select:disabled { cursor: default; opacity: 0.95; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--modal-bg);
      color: var(--text-main);
      border-radius: 12px;
      padding: 24px;
      max-width: 650px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      .modal-content { flex-direction: column; }
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      font-size: 1.2rem;
      background: none; border: none;
      color: var(--text-main); cursor: pointer;
    }

    .modal-poster {
      width: 200px;
      border-radius: 8px;
      object-fit: cover;
      aspect-ratio: 2/3;
      flex-shrink: 0;
    }

    .modal-info { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">My Movie Journal</h1>
      <p class="subtitle">"VIETBANGLANG"</p>
      
      <div class="toolbar">
        <div class="stats-badge">Tổng số phim: <span id="total-count">0</span></div>
        <div class="stats-badge">Điểm trung bình: <span id="avg-score">0.0</span>/10</div>
        
        <button class="btn btn-darkmode" onclick="toggleDarkMode()">🎬 Chế độ Tối</button>
        <button class="btn btn-export" onclick="exportPDFWithPosters()">📄 Xuất PDF (Grid 3x3)</button>

        <button id="btn-add" class="btn" style="display:none;" onclick="addNewMovie()">+ Thêm Phim Mới</button>
        <button id="btn-auth" class="btn btn-auth" onclick="toggleAuth()">🔓 Đăng Nhập Quản Trị</button>
      </div>

      <div class="controls-bar">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="🔍 Tìm tên phim, diễn viên, năm..." oninput="render()">
        </div>
        <select id="sort-select" class="sort-select" onchange="render()">
          <option value="custom">Thứ tự tùy chỉnh (Kéo thả)</option>
          <option value="newest">⏳ Phim mới thêm gần đây</option>
          <option value="rating-desc">⭐ Điểm từ cao đến thấp</option>
          <option value="rating-asc">⭐ Điểm từ thấp đến cao</option>
          <option value="year-desc">📅 Năm phát hành mới nhất</option>
        </select>
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('ALL', this)">Tất cả</button>
        <button class="tab-btn" onclick="setFilter('TQ', this)">🇨🇳 Trung Quốc</button>
        <button class="tab-btn" onclick="setFilter('HQ', this)">🇰🇷 Hàn Quốc</button>
        <button class="tab-btn" onclick="setFilter('AM', this)">🇺🇸 Âu Mỹ</button>
        <button class="tab-btn" onclick="setFilter('NB', this)">🇯🇵 Nhật Bản</button>
        <button class="tab-btn" onclick="setFilter('VN', this)">🇻🇳 Việt Nam</button>
        <button class="tab-btn" onclick="setFilter('TL', this)">🇹🇭 Thái Lan</button>
        <button class="tab-btn" onclick="setFilter('Khac', this)">🌐 Khác</button>
      </div>
    </div>

    <div class="grid" id="movie-grid"></div>
  </div>

  <div class="modal-overlay" id="movie-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modal-img" class="modal-poster" src="" alt="Poster">
      <div class="modal-info">
        <h2 id="modal-title" style="font-family: var(--font-hand);"></h2>
        <p id="modal-meta" style="color: var(--text-muted); font-size: 0.9rem;"></p>
        <p id="modal-rating" style="font-size: 1.1rem; color: #d4a359; font-weight: bold;"></p>
        <p id="modal-tags" style="font-size: 0.85rem; margin-top: 10px;"></p>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "8438"; 
    let isAdmin = false;
    let currentFilter = 'ALL';

    const firebaseConfig = {
      apiKey: "AIzaSyCXPVd1-GAddLziXcyT0n3ZAGzpMdLXxSQ",
      authDomain: "y-movie-journal.firebaseapp.com",
      databaseURL: "https://y-movie-journal-default-rtdb.firebaseio.com",
      projectId: "y-movie-journal",
      storageBucket: "y-movie-journal.firebasestorage.app",
      messagingSenderId: "996386139869",
      appId: "1:996386139869:web:e2e08c45f186b1f69b534",
      measurementId: "G-T1H63T700W"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('movies');

    let movies = [];
    let sortableInstance = null;

    db.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        movies = [];
      } else {
        let tempArr = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
        movies = tempArr;
      }
      render();
    });

    function normalizeStr(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d").replace(/Đ/g, "d")
        .replace(/[\s\-_]/g, "");
    }

    function toggleAuth() {
      if (isAdmin) {
        isAdmin = false;
        alert("Đã thoát chế độ Quản trị!");
      } else {
        const pwd = prompt("Nhập mật khẩu quản trị để chỉnh sửa:");
        if (pwd === ADMIN_PASSWORD) {
          isAdmin = true;
          alert("Đăng nhập thành công!");
        } else if (pwd !== null) {
          alert("Mật khẩu không đúng!");
        }
      }
      render();
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function saveToCloud() {
      if (!isAdmin) return;
      const moviesObj = {};
      movies.forEach((m, index) => {
        m.order = index;
        moviesObj[m.id] = m;
      });
      db.set(moviesObj);
    }

    function setFilter(countryCode, btnElement) {
      currentFilter = countryCode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      render();
    }

    function render() {
      const grid = document.getElementById('movie-grid');
      const btnAdd = document.getElementById('btn-add');
      const btnAuth = document.getElementById('btn-auth');
      const searchKey = normalizeStr(document.getElementById('search-input').value);
      const sortType = document.getElementById('sort-select').value;

      btnAdd.style.display = isAdmin ? 'inline-block' : 'none';
      btnAuth.innerText = isAdmin ? '🔒 Thoát Quản Trị' : '🔓 Đăng Nhập Quản Trị';

      grid.innerHTML = '';

      let processedList = currentFilter === 'ALL' 
        ? [...movies] 
        : movies.filter(m => m.country === currentFilter);

      if (searchKey) {
        processedList = processedList.filter(m => {
          const titleNorm = normalizeStr(m.title);
          const genreNorm = normalizeStr(m.genre);
          const yearNorm = normalizeStr(m.year);
          return titleNorm.includes(searchKey) || genreNorm.includes(searchKey) || yearNorm.includes(searchKey);
        });
      }

      if (sortType === 'newest') {
        processedList.sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));
      } else if (sortType === 'rating-desc') {
        processedList.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      } else if (sortType === 'rating-asc') {
        processedList.sort((a, b) => (a.rating || 0) - (b.rating || 0));
      } else if (sortType === 'year-desc') {
        processedList.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
      } else {
        processedList.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      }

      processedList.forEach((m) => {
        if (!m || !m.id) return;
        const card = document.createElement('div');
        card.className = `card ${isAdmin ? 'is-admin' : ''}`;
        card.setAttribute('data-id', m.id);
        card.setAttribute('data-country', m.country || 'TQ');
        card.innerHTML = `
          <div class="card-actions">
            <button class="icon-btn" title="Chụp ảnh thẻ phim" onclick="shareCard('${m.id}')">📸</button>
            ${isAdmin ? `<button class="icon-btn" title="Xóa" onclick="deleteMovie('${m.id}')">✕</button>` : ''}
          </div>

          <div class="poster-frame" onclick="handlePosterClick('${m.id}')">
            ${m.poster 
              ? `<img src="${m.poster}" crossorigin="anonymous">` 
              : `<div style="font-size:0.75rem; color:var(--text-muted);">
                   ${isAdmin ? 'Bấm chọn file / Dán link ảnh' : 'Chưa có poster'}
                 </div>`}
            <input type="file" id="file-${m.id}" class="file-input" accept="image/*" onchange="handleFileSelect(event, '${m.id}')">
          </div>

          <div class="movie-title editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'title', this.innerText)">${m.title || ''}</div>
          
          <div class="movie-meta">
            <span class="editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'year', this.innerText)">${m.year || ''}</span>
            <span>•</span>
            <span class="editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'genre', this.innerText)">${m.genre || ''}</span>
          </div>

          <div class="rating-container">
            <div class="stars-wrapper">${renderStars(m.id, m.rating)}</div>
            <div style="font-size:0.75rem; margin-top:4px; text-align:right;"><b>${(m.rating || 0).toFixed(1)}</b>/10</div>
          </div>

          <div class="tags-container">
            <select class="tag-select" ${!isAdmin ? 'disabled' : ''} onchange="updateField('${m.id}', 'country', this.value)">
              <option value="TQ" ${m.country === 'TQ' ? 'selected' : ''}>🇨🇳 Trung Quốc</option>
              <option value="HQ" ${m.country === 'HQ' ? 'selected' : ''}>🇰🇷 Hàn Quốc</option>
              <option value="AM" ${m.country === 'AM' ? 'selected' : ''}>🇺🇸 Âu Mỹ</option>
              <option value="NB" ${m.country === 'NB' ? 'selected' : ''}>🇯🇵 Nhật Bản</option>
              <option value="VN" ${m.country === 'VN' ? 'selected' : ''}>🇻🇳 Việt Nam</option>
              <option value="TL" ${m.country === 'TL' ? 'selected' : ''}>🇹🇭 Thái Lan</option>
              <option value="Khac" ${m.country === 'Khac' ? 'selected' : ''}>🌐 Khác</option>
            </select>

            <select class="tag-select" ${!isAdmin ? 'disabled' : ''} onchange="updateField('${m.id}', 'type', this.value)">
              <option value="Bộ" ${m.type === 'Bộ' ? 'selected' : ''}>📺 Phim Bộ</option>
              <option value="Lẻ" ${m.type === 'Lẻ' ? 'selected' : ''}>🎬 Phim Lẻ</option>
              <option value="Anime" ${m.type === 'Anime' ? 'selected' : ''}>🎨 Anime/Hoạt hình</option>
              <option value="Show" ${m.type === 'Show' ? 'selected' : ''}>🎪 TV Show</option>
            </select>
          </div>
        `;
        grid.appendChild(card);
      });

      if (sortableInstance) {
        sortableInstance.destroy();
        sortableInstance = null;
      }

      if (isAdmin && currentFilter === 'ALL' && sortType === 'custom' && !searchKey) {
        sortableInstance = new Sortable(grid, {
          animation: 150,
          onEnd: function () {
            const newMoviesOrder = [];
            grid.querySelectorAll('.card').forEach(card => {
              const id = card.getAttribute('data-id');
              const found = movies.find(m => m.id === id);
              if (found) newMoviesOrder.push(found);
            });
            movies = newMoviesOrder;
            saveToCloud();
          }
        });
      }

      updateStats(processedList);
    }

    function renderStars(id, rating) {
      let html = '';
      for (let i = 1; i <= 10; i++) {
        let fillWidth = 0;
        if (rating >= i) fillWidth = 100;
        else if (rating >= i - 0.5) fillWidth = 50;

        html += `
          <div class="star-box ${isAdmin ? 'can-edit' : ''}">
            ${isAdmin ? `
              <div class="click-zone left" onclick="setRating('${id}', ${i - 0.5})"></div>
              <div class="click-zone right" onclick="setRating('${id}', ${i})"></div>
            ` : ''}
            <span class="star-base">★</span>
            <span class="star-fill" style="width: ${fillWidth}%;">★</span>
          </div>
        `;
      }
      return html;
    }

    function setRating(id, score) {
      if (!isAdmin) return;
      const m = movies.find(x => x.id === id);
      if (m) { m.rating = score; saveToCloud(); }
    }

    function updateField(id, field, val) {
      if (!isAdmin) return;
      const m = movies.find(x => x.id === id);
      if (m) { 
        m[field] = val; 
        saveToCloud(); 
      }
    }

    function addNewMovie() {
      if (!isAdmin) return;
      const defaultCountry = currentFilter === 'ALL' ? 'TQ' : currentFilter;
      const newMovie = {
        id: Date.now().toString(),
        title: 'Tên Phim Mới',
        year: '2026',
        genre: 'Thể loại / Diễn viên',
        rating: 0,
        poster: '',
        country: defaultCountry,
        type: 'Bộ',
        order: movies.length
      };
      movies.push(newMovie);
      saveToCloud();
    }

    function deleteMovie(id) {
      if (!isAdmin) return;
      movies = movies.filter(x => x.id !== id);
      saveToCloud();
    }

    function updateStats(currentList) {
      document.getElementById('total-count').innerText = currentList.length;
      if (currentList.length === 0) { document.getElementById('avg-score').innerText = '0.0'; return; }
      const sum = currentList.reduce((acc, curr) => acc + (curr.rating || 0), 0);
      document.getElementById('avg-score').innerText = (sum / currentList.length).toFixed(1);
    }

    function handlePosterClick(id) {
      const m = movies.find(x => x.id === id);
      if (!m) return;

      if (isAdmin) {
        const choice = prompt("Nhập 1 để TẢI FILE TỪ MÁY TÍNH\nHoặc DÁN LINK ẢNH trực tiếp vào đây:");
        if (choice === '1') {
          document.getElementById(`file-${id}`).click();
        } else if (choice && choice.trim().startsWith('http')) {
          m.poster = choice.trim(); saveToCloud();
        }
      } else {
        document.getElementById('modal-img').src = m.poster || 'https://via.placeholder.com/200x300?text=No+Poster';
        document.getElementById('modal-title').innerText = m.title || 'Chưa có tên';
        document.getElementById('modal-meta').innerText = `${m.year || ''} • ${m.genre || ''}`;
        document.getElementById('modal-rating').innerText = `⭐ ${m.rating || 0}/10`;
        document.getElementById('modal-tags').innerText = `Quốc gia: ${m.country || 'TQ'} | Loại: ${m.type || 'Bộ'}`;
        document.getElementById('movie-modal').classList.add('active');
      }
    }

    function closeModal(e) {
      document.getElementById('movie-modal').classList.remove('active');
    }

    function handleFileSelect(e, id) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const m = movies.find(x => x.id === id);
          if (m) { m.poster = evt.target.result; saveToCloud(); }
        };
        reader.readAsDataURL(file);
      }
    }

    /* HÀM CHUYỂN URL ẢNH THÀNH BASE64 AN TOÀN TRÁNH BỊ CHẶN CORS */
    async function getBase64ImageFromUrl(imageUrl) {
      if (!imageUrl) return '';
      if (imageUrl.startsWith('data:image')) return imageUrl;
      
      try {
        const response = await fetch(imageUrl, { mode: 'cors' });
        const blob = await response.blob();
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => resolve('');
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        // Fallback qua proxy cors nếu bị chặn header trực tiếp
        try {
          const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(imageUrl);
          const res = await fetch(proxyUrl);
          const blob = await res.blob();
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = () => resolve('');
            reader.readAsDataURL(blob);
          });
        } catch (err) {
          return '';
        }
      }
    }

    /* TÍNH NĂNG CHỤP ÁNH THẺ PHIM ĐÃ KHẮC PHỤC MẤT HÌNH */
    async function shareCard(id) {
      const m = movies.find(x => x.id === id);
      const cardEl = document.querySelector(`.card[data-id="${id}"]`);
      if (!cardEl || !m) return;

      const imgEl = cardEl.querySelector('.poster-frame img');
      let originalSrc = '';
      
      // Xử lý nạp tạm Base64 cho thẻ để html2canvas chụp không bị trắng
      if (imgEl && m.poster && !m.poster.startsWith('data:image')) {
        originalSrc = imgEl.src;
        const b64 = await getBase64ImageFromUrl(m.poster);
        if (b64) imgEl.src = b64;
      }

      html2canvas(cardEl, { 
        scale: 2, 
        useCORS: true, 
        allowTaint: true 
      }).then(canvas => {
        if (imgEl && originalSrc) imgEl.src = originalSrc;
        const link = document.createElement('a');
        link.download = `movie-card-${id}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        if (imgEl && originalSrc) imgEl.src = originalSrc;
      });
    }

    /* XUẤT PDF ĐÃ SỬA LỖI MẤT HÌNH & BỊ TRẮNG XÓA POSTER */
    async function exportPDFWithPosters() {
      let exportList = currentFilter === 'ALL' 
        ? [...movies] 
        : movies.filter(m => m.country === currentFilter);

      const searchKey = normalizeStr(document.getElementById('search-input').value);
      if (searchKey) {
        exportList = exportList.filter(m => {
          const titleNorm = normalizeStr(m.title);
          const genreNorm = normalizeStr(m.genre);
          const yearNorm = normalizeStr(m.year);
          return titleNorm.includes(searchKey) || genreNorm.includes(searchKey) || yearNorm.includes(searchKey);
        });
      }

      if (exportList.length === 0) { 
        alert("Không có phim nào để xuất PDF!"); 
        return; 
      }

      const titleCode = currentFilter === 'ALL' ? 'ALL' : currentFilter.toUpperCase();
      const pdfMainTitle = `MY MOVIE JOURNAL - VBL_${titleCode}`;

      alert(`Đang tải dữ liệu hình ảnh cho ${exportList.length} phim... Bạn đợi chút nhé!`);

      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'absolute';
      tempContainer.style.top = '-9999px';
      tempContainer.style.left = '-9999px';
      tempContainer.style.width = '800px';
      tempContainer.style.background = '#ffffff';
      tempContainer.style.padding = '20px';
      document.body.appendChild(tempContainer);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = 210;

      for (let i = 0; i < exportList.length; i++) {
        const m = exportList[i];

        if (i > 0 && i % 9 === 0) {
          pdf.addPage();
        }

        if (i % 9 === 0) {
          pdf.setFont("Helvetica", "bold");
          pdf.setFontSize(14);
          pdf.text(pdfMainTitle, pageWidth / 2, 15, { align: "center" });
        }

        const countryBgColors = {
          TQ: '#ffe6e6', HQ: '#e0f0ff', AM: '#f2e2fe',
          NB: '#ffe2ee', VN: '#fff9cf', TL: '#dcf5d7', Khac: '#ebeae6'
        };
        const countryBorderColors = {
          TQ: '#f19999', HQ: '#8bbdf5', AM: '#cc9bf4',
          NB: '#f79cc0', VN: '#f1d460', TL: '#8edc82', Khac: '#beb8ad'
        };

        const bg = countryBgColors[m.country] || '#ffffff';
        const border = countryBorderColors[m.country] || '#cccccc';

        // Lấy dữ liệu Base64 an toàn cho poster
        let posterDataUrl = '';
        if (m.poster) {
          posterDataUrl = await getBase64ImageFromUrl(m.poster);
        }

        tempContainer.innerHTML = `
          <div id="pdf-card-temp" style="width: 220px; padding: 12px; background: ${bg}; border: 2px solid ${border}; border-radius: 10px; box-sizing: border-box; font-family: sans-serif;">
            <div style="width: 100%; height: 260px; overflow: hidden; border-radius: 6px; background: #eee; margin-bottom: 8px;">
              ${posterDataUrl 
                ? `<img src="${posterDataUrl}" style="width:100%; height:100%; object-fit:cover;">` 
                : '<div style="line-height:260px; text-align:center; color:#888;">No Poster</div>'}
            </div>
            <div style="font-weight: bold; font-size: 14px; color: #2c2a29; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;">${m.title || 'Chưa có tên'}</div>
            <div style="font-size: 11px; color: #615e5a; margin-bottom: 4px;">${m.year || ''} • ${m.genre || ''}</div>
            <div style="font-size: 12px; color: #d4a359; font-weight: bold;">⭐ ${(m.rating || 0)}/10</div>
            <div style="font-size: 10px; color: #888; margin-top: 4px;">[VBL_${m.country || 'TQ'}] ${m.type || 'Bộ'}</div>
          </div>
        `;

        const cardEl = document.getElementById('pdf-card-temp');
        const canvas = await html2canvas(cardEl, { scale: 2, useCORS: true, allowTaint: true, logging: false });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);

        const indexInPage = i % 9;
        const col = indexInPage % 3;
        const row = Math.floor(indexInPage / 3);

        const marginX = 15;
        const startY = 25;
        const colWidth = 56;
        const rowHeight = 80;
        const gapX = 6;
        const gapY = 8;

        const x = marginX + col * (colWidth + gapX);
        const y = startY + row * (rowHeight + gapY);

        pdf.addImage(imgData, 'JPEG', x, y, colWidth, rowHeight);
      }

      document.body.removeChild(tempContainer);
      pdf.save(`Movie_Journal_VBL_${titleCode}_${new Date().toISOString().slice(0,10)}.pdf`);
    }
  </script>
