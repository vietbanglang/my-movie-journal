<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY MOVIE JOURNAL</title>
  
  <!-- Thư viện hỗ trợ Xuất PDF (html2canvas + jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    /* Tiêu đề chính */
    .header-title {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Bộ lọc buttons */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 1px solid #ddd;
      background: #f8f9fa;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    .export-btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Grid danh sách phim */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .movie-card {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .poster-box {
      width: 100%;
      height: 280px;
      background: #e9ecef;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
      margin: 6px 0 4px 0;
    }

    .movie-meta {
      font-size: 13px;
      color: #666;
    }

    .movie-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 4px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container" id="pdf-export-area">
    
    <!-- Tiêu đề -->
    <h1 class="header-title" id="main-title">MY MOVIE JOURNAL - TẤT CẢ PHIM</h1>

    <!-- Thanh lọc quốc gia & Nút xuất PDF -->
    <div style="text-align: center;">
      <button class="export-btn" onclick="exportToPDF()">📄 Xuất PDF (Grid 3x3)</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCountry('Tất cả', this)">Tất cả</button>
      <button class="filter-btn" onclick="filterCountry('Trung Quốc', this)">cn Trung Quốc</button>
      <button class="filter-btn" onclick="filterCountry('Hàn Quốc', this)">kr Hàn Quốc</button>
      <button class="filter-btn" onclick="filterCountry('Âu Mỹ', this)">us Âu Mỹ</button>
      <button class="filter-btn" onclick="filterCountry('Nhật Bản', this)">jp Nhật Bản</button>
      <button class="filter-btn" onclick="filterCountry('Việt Nam', this)">vn Việt Nam</button>
      <button class="filter-btn" onclick="filterCountry('Thái Lan', this)">th Thái Lan</button>
    </div>

    <!-- Khung chứa danh sách phim -->
    <div class="movie-grid">
      
      <div class="movie-card" data-country="Trung Quốc">
        <div class="poster-box">
          <img src="https://via.placeholder.com/200x280" alt="Nhất Kiến Khuynh Tâm">
        </div>
        <div class="movie-title">Nhất Kiến Khuynh Tâm</div>
        <div class="movie-meta">2021 • ⭐ 9/10</div>
        <div class="movie-tag">[TQ] Bộ</div>
      </div>

      <div class="movie-card" data-country="Hàn Quốc">
        <div class="poster-box">
          <img src="https://via.placeholder.com/200x280" alt="Chuyện Tình Tóc Rối">
        </div>
        <div class="movie-title">Chuyện Tình Tóc Rối</div>
        <div class="movie-meta">2025 • ⭐ 8/10</div>
        <div class="movie-tag">[HQ] Lẻ</div>
      </div>

      <div class="movie-card" data-country="Trung Quốc">
        <div class="poster-box">
          <img src="https://via.placeholder.com/200x280" alt="Hôn Lễ Của Em">
        </div>
        <div class="movie-title">Hôn Lễ Của Em</div>
        <div class="movie-meta">2021 • ⭐ 9.5/10</div>
        <div class="movie-tag">[TQ] Lẻ</div>
      </div>

    </div>

  </div>

  <script>
    // Biến lưu trữ tên quốc gia đang chọn
    let currentSelectedCountry = 'ALL';

    // 1. Hàm lọc danh sách phim theo nút bấm
    function filterCountry(countryName, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const countryCodeMap = {
        'Tất cả': 'ALL',
        'Trung Quốc': 'TQ',
        'Hàn Quốc': 'HQ',
        'Âu Mỹ': 'US',
        'Nhật Bản': 'JP',
        'Việt Nam': 'VN',
        'Thái Lan': 'TH'
      };

      currentSelectedCountry = countryCodeMap[countryName] || 'ALL';

      // Lọc ẩn/hiện card phim
      const cards = document.querySelectorAll('.movie-card');
      cards.forEach(card => {
        if (countryName === 'Tất cả' || card.getAttribute('data-country') === countryName) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // 2. HÀM XUẤT PDF HOÀN CHỈNH (SỬA LỖI FONT & TỰ ĐỔI TIÊU ĐỀ)
    async function exportToPDF() {
      const titleElement = document.getElementById('main-title');
      const badgeElements = document.querySelectorAll('.movie-tag');

      // Lưu lại giá trị gốc trước khi chụp
      const originalTitleText = titleElement.innerText;
      const originalBadges = [];

      try {
        // A. Đổi tiêu đề sang chữ mới không lỗi font: "MY MOVIE JOURNAL - VBL_[MÃ]"
        titleElement.innerText = `MY MOVIE JOURNAL - VBL_${currentSelectedCountry}`;

        // B. Chuyển đổi nhãn quốc gia trên từng thẻ phim sang dạng VBL_...
        const tagMap = {
          '[TQ]': '[VBL_TQ]',
          '[HQ]': '[VBL_HQ]',
          '[US]': '[VBL_US]',
          '[JP]': '[VBL_JP]',
          '[VN]': '[VBL_VN]',
          '[TH]': '[VBL_TH]'
        };

        badgeElements.forEach((badge) => {
          originalBadges.push({ element: badge, text: badge.innerText });
          let badgeText = badge.innerText;
          Object.keys(tagMap).forEach(key => {
            if (badgeText.includes(key)) {
              badgeText = badgeText.replace(key, tagMap[key]);
            }
          });
          badge.innerText = badgeText;
        });

        // C. Chụp ảnh khung HTML bằng html2canvas
        const elementToCapture = document.getElementById('pdf-export-area');
        const canvas = await html2canvas(elementToCapture, {
          scale: 2,
          useCORS: true,
          logging: false
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.95);

        // D. Khởi tạo file PDF kích thước A4
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Movie_Journal_VBL_${currentSelectedCountry}.pdf`);

      } catch (error) {
        console.error("Lỗi xuất PDF:", error);
        alert("Có lỗi xảy ra khi tạo file PDF!");
      } finally {
        // E. Khôi phục lại giao diện trang web ban đầu
        titleElement.innerText = originalTitleText;
        originalBadges.forEach(item => {
          item.element.innerText = item.text;
        });
      }
    }
  </script>
</body>
</html>
