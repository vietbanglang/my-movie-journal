<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #f7f4ef;
      --card-bg: #ffffff;
      --text-main: #2c2a29;
      --text-muted: #787571;
      --border-color: #e5dfd5;
      --accent-star: #d4a359;
      --star-empty: #e0d8cc;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-hand: 'Lora', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 40px 20px;
      background-image: radial-gradient(#e2dad0 0.8px, transparent 0.8px);
      background-size: 16px 16px;
    }

    .container { max-width: 1280px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 35px; }

    .title {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: var(--font-hand);
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stats-badge {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      box-shadow: var(--shadow-sm);
    }

    .btn {
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-auth { background: #d4a359; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .btn-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--border-color);
      color: #888;
      cursor: pointer;
      z-index: 10;
    }

    .poster-frame {
      width: 100%;
      aspect-ratio: 2 / 3;
      border: 1px dashed #c8c2b7;
      border-radius: 6px;
      background: #fcfbfa;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      text-align: center;
      padding: 8px;
    }

    .poster-frame.can-edit { cursor: pointer; }
    .poster-frame img { width: 100%; height: 100%; object-fit: cover; }
    .file-input { display: none; }

    .editable-text { outline: none; padding: 2px 4px; border-radius: 3px; }
    .editable-text.can-edit:focus { background: #f0eae1; }

    .movie-title { font-family: var(--font-hand); font-size: 1.1rem; font-weight: 600; }
    .movie-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 4px; }

    .rating-container {
      background: #fbf9f6;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
    }

    .stars-wrapper { display: flex; justify-content: space-between; }
    .star-box { position: relative; font-size: 1rem; width: 10%; text-align: center; }
    .star-box.can-edit { cursor: pointer; }
    .star-base { color: var(--star-empty); }
    .star-fill { position: absolute; top: 0; left: 0; color: var(--accent-star); overflow: hidden; width: 0%; pointer-events: none; }
    .click-zone { position: absolute; top: 0; height: 100%; width: 50%; z-index: 2; }
    .click-zone.left { left: 0; }
    .click-zone.right { right: 0; }

    .note-input {
      width: 100%;
      border: none;
      border-bottom: 1px dashed var(--border-color);
      background: transparent;
      font-family: var(--font-hand);
      font-size: 0.82rem;
      resize: none;
      outline: none;
      height: 38px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">My Movie Journal</h1>
      <p class="subtitle">"Memories, emotions, and personal cinema collection"</p>
      
      <div class="toolbar">
        <div class="stats-badge">Tổng số phim: <span id="total-count">0</span></div>
        <div class="stats-badge">Điểm trung bình: <span id="avg-score">0.0</span>/10</div>
        
        <button id="btn-add" class="btn" style="display:none;" onclick="addNewMovie()">+ Thêm Phim Mới</button>
        <button id="btn-auth" class="btn btn-auth" onclick="toggleAuth()">🔓 Đăng Nhập Quản Trị</button>
      </div>
    </div>

    <div class="grid" id="movie-grid"></div>
  </div>

  <script>
    // Mật khẩu đăng nhập quản trị của bạn
    const ADMIN_PASSWORD = "8438"; 
    let isAdmin = false;

    const firebaseConfig = {
      apiKey: "AIzaSyCXPVd1-GAddLziXcyT0n3ZAGzpMdLXxSQ",
      authDomain: "y-movie-journal.firebaseapp.com",
      databaseURL: "https://y-movie-journal-default-rtdb.firebaseio.com",
      projectId: "y-movie-journal",
      storageBucket: "y-movie-journal.firebasestorage.app",
      messagingSenderId: "996386139869",
      appId: "1:996386139869:web:e2e08c45f186b1f69b534",
      measurementId: "G-T1H63T700W"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('movies');

    let movies = [];

    db.on('value', (snapshot) => {
      const data = snapshot.val();
      movies = data ? Object.values(data) : [];
      render();
    });

    function toggleAuth() {
      if (isAdmin) {
        isAdmin = false;
        alert("Đã thoát chế độ Quản trị!");
      } else {
        const pwd = prompt("Nhập mật khẩu quản trị để chỉnh sửa:");
        if (pwd === ADMIN_PASSWORD) {
          isAdmin = true;
          alert("Đăng nhập thành công! Bạn có thể chỉnh sửa trang web.");
        } else if (pwd !== null) {
          alert("Mật khẩu không đúng!");
        }
      }
      render();
    }

    function saveToCloud() {
      if (!isAdmin) return;
      const moviesObj = {};
      movies.forEach(m => { moviesObj[m.id] = m; });
      db.set(moviesObj);
    }

    function render() {
      const grid = document.getElementById('movie-grid');
      const btnAdd = document.getElementById('btn-add');
      const btnAuth = document.getElementById('btn-auth');

      btnAdd.style.display = isAdmin ? 'inline-block' : 'none';
      btnAuth.innerText = isAdmin ? '🔒 Thoát Quản Trị' : '🔓 Đăng Nhập Quản Trị';

      grid.innerHTML = '';

      movies.forEach((m) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${isAdmin ? `<button class="btn-delete" onclick="deleteMovie('${m.id}')">✕</button>` : ''}

          <div class="poster-frame ${isAdmin ? 'can-edit' : ''}" 
               onclick="${isAdmin ? `handlePosterClick('${m.id}')` : ''}"
               ondragover="event.preventDefault()" 
               ondrop="${isAdmin ? `handleDrop(event, '${m.id}')` : ''}">
            ${m.poster 
              ? `<img src="${m.poster}">` 
              : `<div style="font-size:0.75rem; color:#888;">
                   ${isAdmin ? 'Bấm chọn file / Dán link ảnh' : 'Chưa có poster'}
                 </div>`}
            <input type="file" id="file-${m.id}" class="file-input" accept="image/*" onchange="handleFileSelect(event, '${m.id}')">
          </div>

          <div class="movie-title editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'title', this.innerText)">${m.title}</div>
          
          <div class="movie-meta">
            <span class="editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'year', this.innerText)">${m.year}</span>
            <span>•</span>
            <span class="editable-text ${isAdmin ? 'can-edit' : ''}" contenteditable="${isAdmin}" onblur="updateField('${m.id}', 'genre', this.innerText)">${m.genre}</span>
          </div>

          <div class="rating-container">
            <div class="stars-wrapper">${renderStars(m.id, m.rating)}</div>
            <div style="font-size:0.75rem; margin-top:4px; text-align:right;"><b>${(m.rating || 0).toFixed(1)}</b>/10</div>
          </div>

          <textarea class="note-input" ${!isAdmin ? 'readonly' : ''} placeholder="${isAdmin ? 'Ghi chú review...' : ''}" onblur="updateField('${m.id}', 'note', this.value)">${m.note || ''}</textarea>
        `;
        grid.appendChild(card);
      });

      updateStats();
    }

    function renderStars(id, rating) {
      let html = '';
      for (let i = 1; i <= 10; i++) {
        let fillWidth = 0;
        if (rating >= i) fillWidth = 100;
        else if (rating >= i - 0.5) fillWidth = 50;

        html += `
          <div class="star-box ${isAdmin ? 'can-edit' : ''}">
            ${isAdmin ? `
              <div class="click-zone left" onclick="setRating('${id}', ${i - 0.5})"></div>
              <div class="click-zone right" onclick="setRating('${id}', ${i})"></div>
            ` : ''}
            <span class="star-base">★</span>
            <span class="star-fill" style="width: ${fillWidth}%;">★</span>
          </div>
        `;
      }
      return html;
    }

    function setRating(id, score) {
      if (!isAdmin) return;
      const m = movies.find(x => x.id === id);
      if (m) { m.rating = score; saveToCloud(); }
    }

    function updateField(id, field, val) {
      if (!isAdmin) return;
      const m = movies.find(x => x.id === id);
      if (m) { m[field] = val.trim(); saveToCloud(); }
    }

    function addNewMovie() {
      if (!isAdmin) return;
      const newMovie = {
        id: Date.now().toString(),
        title: 'Tên Phim Mới',
        year: '2026',
        genre: 'Thể loại',
        rating: 0,
        poster: '',
        note: ''
      };
      movies.push(newMovie);
      saveToCloud();
    }

    function deleteMovie(id) {
      if (!isAdmin) return;
      movies = movies.filter(x => x.id !== id);
      saveToCloud();
    }

    function updateStats() {
      document.getElementById('total-count').innerText = movies.length;
      if (movies.length === 0) { document.getElementById('avg-score').innerText = '0.0'; return; }
      const sum = movies.reduce((acc, curr) => acc + (curr.rating || 0), 0);
      document.getElementById('avg-score').innerText = (sum / movies.length).toFixed(1);
    }

    function handlePosterClick(id) {
      if (!isAdmin) return;
      const choice = prompt("Nhập 1 để TẢI FILE TỪ MÁY TÍNH\nHoặc DÁN LINK ẢNH trực tiếp vào đây:");
      if (choice === '1') {
        document.getElementById(`file-${id}`).click();
      } else if (choice && choice.trim().startsWith('http')) {
        const m = movies.find(x => x.id === id);
        if (m) { m.poster = choice.trim(); saveToCloud(); }
      }
    }

    function handleFileSelect(e, id) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const m = movies.find(x => x.id === id);
          if (m) { m.poster = evt.target.result; saveToCloud(); }
        };
        reader.readAsDataURL(file);
      }
    }

    function handleDrop(e, id) {
      if (!isAdmin) return;
      e.preventDefault();
      const imageUrl = e.dataTransfer.getData('text/html');
      const srcMatch = imageUrl ? imageUrl.match(/src\s*=\s*"([^"]+)"/) : null;
      const directUrl = e.dataTransfer.getData('text/plain');

      let finalUrl = '';
      if (srcMatch && srcMatch[1]) finalUrl = srcMatch[1];
      else if (directUrl && directUrl.startsWith('http')) finalUrl = directUrl;

      if (finalUrl) {
        const m = movies.find(x => x.id === id);
        if (m) { m.poster = finalUrl; saveToCloud(); }
      }
    }
  </script>
</body>
</html>
